<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Spark Deck logo</title>
  <desc id="desc">Two overlapping blue study cards with a white lightning bolt.</desc>

  <defs>
    <linearGradient id="backCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>

    <linearGradient id="frontCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="52%" stop-color="#2196F3"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <filter id="shadow" x="-35%" y="-25%" width="170%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>

    <filter id="boltShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Narrower rear card -->
  <g transform="translate(92 76) rotate(-14 145 180)" filter="url(#shadow)">
    <rect
      x="0" y="0"
      width="290" height="370"
      rx="40"
      fill="url(#backCard)"
      stroke="#FFFFFF"
      stroke-width="14"
    />
  </g>

  <!-- Taller, narrower foreground card to match the original generated design -->
  <g transform="translate(118 42) rotate(8 145 214)" filter="url(#shadow)">
    <rect
      x="0" y="0"
      width="290" height="428"
      rx="43"
      fill="url(#frontCard)"
      stroke="#FFFFFF"
      stroke-width="15"
    />

    <!-- Subtle glossy highlight -->
    <path
      d="M42 58 Q42 31 69 31 H220"
      fill="none"
      stroke="#FFFFFF"
      stroke-opacity="0.20"
      stroke-width="9"
      stroke-linecap="round"
    />

    <!-- Lightning bolt -->
    <path
      d="M171 78
         L94 219
         H151
         L123 348
         L233 192
         H173
         L207 78
         Z"
      fill="#FFFFFF"
      filter="url(#boltShadow)"
    />
  </g>
</svg>
